# Corrected 2026-11-23. The previous list had three wrong dates (20-Mar, 27-May, 26-Aug: the
# market traded a full session on each) and was missing six real closures. Every past date below
# was cross-checked against FYERS 1m history: zero bars in NIFTY, BANKNIFTY, India VIX, NIFTY
# futures and five NIFTY heavyweights on each listed day, and full sessions on all others.
# Weekend holidays (Mahashivratri, Id-Ul-Fitr, Independence Day, Diwali Laxmi Pujan) are omitted:
# they don't remove a trading day. Muhurat trading (Sun 8-Nov) is in market_sessions.yaml.
