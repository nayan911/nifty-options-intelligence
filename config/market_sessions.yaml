# NSE Market Sessions Configuration
version: "1.0"
timezone: "Asia/Kolkata"

# Standard session timings (IST)
standard:
  pre_open_start: "09:00:00"
  pre_open_end: "09:08:00"
  pre_open_settlement: "09:15:00"
  cash_open: "09:15:00"
  cash_close: "15:30:00"
  derivatives_open: "09:15:00"
  derivatives_close: "15:40:00"  # Current official F&O closing session
  post_market_close: "16:00:00"

# Future framework update scheduled for Dec 7, 2026 onward
future_revisions:
  effective_date: "2026-12-07"
  derivatives_extended_hours_active: false  # Will be toggled upon official exchange rollout

# Special Sessions (Muhurat Trading, DR Drills)
special_sessions:
  # Union Budget day (Sunday): full regular session. Verified in FYERS history: 375 1m bars
  # 09:15-15:29 for NIFTY, India VIX and NIFTY futures.
  "2026-02-01":
    name: "Union Budget Session 2026 (Sunday)"
    session_start: "09:15:00"
    session_end: "15:30:00"
    derivatives_close: "15:40:00"
  # NSE Muhurat Trading 2026 (Diwali Laxmi Pujan, Sunday Nov 8). Previously configured as
  # 18:15-19:15; FYERS history shows the actual session ran 14:20-15:29 (index) and to 15:39
  # (futures).
  "2026-11-08":
    name: "Muhurat Trading 2026"
    session_start: "14:15:00"
    session_end: "15:30:00"
    derivatives_close: "15:40:00"
