# Strategy registry: the single source of truth for every strategy's parameters.
#
# - The live pipeline (scripts/run_market_data.py) and the historical replay both build the
#   technical engine from this file. It is validated strictly at startup: unknown keys, wrong
#   types, out-of-range or contradictory values stop the program instead of running something
#   unintended.
# - Changing any value under `params` changes behaviour: bump `version` and record why in
#   `changelog`. Backtest evidence is attached per version (Phase 3).
# - `fixed` lists indicator definitions computed inside the engine. They are declared here for
#   transparency and must match the code exactly; changing them is a code change and a new
#   strategy, not a YAML edit.
# - Prices are NIFTY index points.

schema_version: 1

strategies:
  S000:
    name: "5m breakout-retest, 15m trend filter, 1m futures-confirmed trigger"
    version: 1
    status: baseline        # baseline | research | observe | live | retired
    description: >
      Decision on the 5-minute NIFTY spot chart: a support/resistance breakout with futures
      volume (RVOL) confirmation, followed by a retest. The 15-minute trend must not oppose it
      and there must be room to the next opposing 15-minute level. Entry is timed on a 1-minute
      candle (momentum, VWAP, RSI not exhausted) and scored 0-100 for confluence.
      Option-chain OI is context only and never vetoes.
    instruments:
      underlying: NIFTY
      signal: "NSE:NIFTY50-INDEX"          # setups and levels come from spot
      confirmation: near_month_futures     # RVOL and VWAP come from the near-month future
    data_requirements:
      # Research series (data/research.duckdb), as named in the dataset manifest.
      series:
        - {instrument: NIFTY_SPOT, kind: SPOT, resolutions: ["1", "D"]}
        - {instrument: NIFTY_FUT, kind: CONT, resolutions: ["1"]}
      # Futures contract-identity tiers a historical result may come from. CONFLICT is never
      # used. Results are always reported separately per tier (Phase 3).
      contract_confidence: [VERIFIED, PARTIALLY_VERIFIED, INFERRED]
      warmup_trading_days: 10

    params:
      levels:
        zone_atr_multiple: 0.15
        min_zone_width_points: 3.0
      swings:
        1m: {left_bars: 3, right_bars: 3}
        5m: {left_bars: 3, right_bars: 3}
        15m: {left_bars: 2, right_bars: 2}
      breakouts:
        1m:
          min_breakout_rvol: 1.3
          min_body_atr_ratio: 0.35
          approach_buffer_atr: 0.25
          min_approach_points: 4.0
          max_retest_candles: 6
          stop_buffer_atr: 0.1
          min_setup_risk_points: 10.0
          setup_target_rr: 1.5
        5m:
          min_breakout_rvol: 1.3
          min_body_atr_ratio: 0.35
          approach_buffer_atr: 0.25
          min_approach_points: 4.0
          max_retest_candles: 4
          stop_buffer_atr: 0.1
          min_setup_risk_points: 10.0
          setup_target_rr: 1.5
      qualification:
        min_headroom_atr_multiple: 1.5
        min_headroom_points: 25.0
        max_15m_macro_age_seconds: 1200.0
        max_5m_futures_age_seconds: 300.0
      entry:
        entry_window_minutes: 15
        max_1m_futures_age_seconds: 60.0
        fallback_stop_points: 25.0
        rsi_overbought: 75.0
        rsi_oversold: 25.0
        min_risk_points: 8.0
      targets:
        target_1_rr: 1.5
        target_2_rr: 2.0
      scoring:
        min_score: 60.0
        trend_aligned: 30.0
        trend_aligned_provisional: 20.0
        trend_sideways: 15.0
        rvol_tiers: [[2.0, 25.0], [1.5, 20.0], [1.3, 15.0]]
        vwap_5m: 10.0
        vwap_1m: 10.0
        headroom_tiers: [[2.0, 15.0], [1.5, 10.0]]
        rsi_bull_range: [50.0, 68.0]
        rsi_bear_range: [32.0, 50.0]
        rsi_points: 10.0

    fixed:
      ema_periods: [9, 21, 50, 200]
      rsi_period: 14
      atr_period: 14
      rvol_lookback_bars: 20
      warmup_min_bars: 21
      history_bars: {1m: 400, 5m: 200, 15m: 100}
      spot_futures_pairing_tolerance_seconds: 5.0
      trend_bias: "EMA9 vs EMA21 with close vs EMA9; provisional structural fallback (opening range, daily references, swings) during warmup"

    evidence: null          # Phase 3 attaches the baseline backtest report for this version
    changelog:
      - {version: 1, date: 2026-11-24, change: "Registered: parameters moved from code unchanged (identical signals verified over the full history)."}
